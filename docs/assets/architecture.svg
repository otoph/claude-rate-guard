<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">claude-rate-guard data flow</title>
  <desc id="desc">Claude Code statusline stdin is teed by statusline-tee.sh into rate_limit_state.json, which rate-guard.sh reads to emit a VERDICT: OK (exit 0) launches, DEFER (exit 10) defers to RESETS_AT, UNKNOWN (exit 20) fails open and proceeds with a flag.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="788" height="588" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- edges (drawn first, nodes on top) -->
  <g fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="400" y1="74"  x2="400" y2="97"/>
    <line x1="400" y1="150" x2="400" y2="186"/>
    <line x1="400" y1="243" x2="400" y2="275"/>
    <line x1="400" y1="322" x2="400" y2="351"/>
    <line x1="400" y1="430" x2="400" y2="503"/>
    <line x1="328" y1="392" x2="170" y2="503"/>
    <line x1="472" y1="392" x2="630" y2="503"/>
  </g>

  <!-- CC -->
  <rect x="216" y="22" width="368" height="52" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="400" y="43" text-anchor="middle" font-size="13" fill="#1f2937">Claude Code / statusline stdin</text>
  <text x="400" y="61" text-anchor="middle" font-size="12" fill="#4b5563">(JSON incl. rate_limits)</text>

  <!-- TEE -->
  <rect x="288" y="98" width="224" height="52" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="400" y="119" text-anchor="middle" font-size="13" fill="#1f2937">statusline-tee.sh</text>
  <text x="400" y="137" text-anchor="middle" font-size="12" fill="#4b5563">(atomic write)</text>

  <!-- ST cylinder -->
  <g>
    <ellipse cx="400" cy="234" rx="132" ry="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <rect x="268" y="196" width="264" height="38" fill="#fef9c3"/>
    <line x1="268" y1="196" x2="268" y2="234" stroke="#eab308" stroke-width="1.5"/>
    <line x1="532" y1="196" x2="532" y2="234" stroke="#eab308" stroke-width="1.5"/>
    <ellipse cx="400" cy="196" rx="132" ry="9" fill="#fde68a" stroke="#eab308" stroke-width="1.5"/>
  </g>
  <text x="400" y="223" text-anchor="middle" font-size="13" fill="#1f2937">rate_limit_state.json</text>

  <!-- G -->
  <rect x="240" y="276" width="320" height="46" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="304" text-anchor="middle" font-size="13" fill="#1f2937">rate-guard.sh — pure shell, no LLM</text>

  <!-- V diamond -->
  <polygon points="400,354 472,392 400,430 328,392" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="400" y="396" text-anchor="middle" font-size="13" fill="#1f2937">VERDICT</text>

  <!-- bottom: GO / W / FO -->
  <rect x="90" y="506" width="140" height="54" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="160" y="538" text-anchor="middle" font-size="13" fill="#166534">launch</text>

  <rect x="295" y="506" width="210" height="54" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="400" y="538" text-anchor="middle" font-size="13" fill="#92400e">defer to RESETS_AT</text>

  <rect x="535" y="506" width="210" height="54" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="640" y="530" text-anchor="middle" font-size="13" fill="#374151">fail-open:</text>
  <text x="640" y="548" text-anchor="middle" font-size="13" fill="#374151">proceed + flag</text>

  <!-- edge labels -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="178" y="438" width="92" height="18" rx="4" fill="#ffffff"/>
    <text x="224" y="451" fill="#16a34a">OK / exit 0</text>

    <rect x="352" y="457" width="96" height="18" rx="4" fill="#ffffff"/>
    <text x="400" y="470" fill="#d97706">DEFER / exit 10</text>

    <rect x="524" y="438" width="116" height="18" rx="4" fill="#ffffff"/>
    <text x="582" y="451" fill="#6b7280">UNKNOWN / exit 20</text>
  </g>
</svg>
