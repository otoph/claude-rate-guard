name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --version
          # rate-guard.sh is the standalone executable: lint it at full strength.
          shellcheck rate-guard.sh
          # statusline-tee.sh is a fragment appended into an existing status-line
          # command. Its inputs (five_pct, etc.) come from the host, and the
          # best-effort write uses `&& ... || true`, so only fail on hard errors.
          shellcheck --shell=bash --severity=error statusline-tee.sh
